name: Wevat
description: Wevat is a Seedcamp-backed fintech and travel-tech company operating a mobile app
  that digitizes VAT (Value Added Tax) refunds for international travellers shopping in France.
  Instead of paper tax-free forms, shoppers photograph their invoices in the Wevat app, which
  consolidates purchases across stores into a single digital tax-refund form, validates it at
  the departure point, and pays out the refund (up to around 13% of spend) in the traveller's
  chosen currency via credit card, bank transfer, Alipay, or WeChat Pay. Wevat is a consumer
  mobile-app product and does not currently publish a public developer API, SDK, or API
  documentation surface; this profile captures its public web and business identity.
